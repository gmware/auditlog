[tox]
envlist =
    {py27,py34,py35,py36}-django-18
    {py27,py34,py35,py36}-django-110
    {py27,py34,py35,py36}-django-111
    {py34,py35,py36}-django-20

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/src/auditlog
    CI_REPLAY_LANE = {envname}
    COVERAGE_FILE = {toxinidir}/.coverage.{envname}
passenv = TRAVIS_JOB_ID TRAVIS_BUILD_ID CI_REPLAY_PHASE CI_REPLAY_LANE
commands =
    python ci_tox_test.py
deps =
    django-18: Django>=1.8,<1.9
    django-110: Django>=1.10,<1.11
    django-111: Django>=1.11,<2.0
    django-20: Django>=2.0
    -r{toxinidir}/requirements-test.txt
basepython =
    py36: python3.6
    py35: python3.5
    py34: python3.4
    py27: python2.7
