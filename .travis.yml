# Config file for automatic testing at travis-ci.org

dist: trusty
sudo: required
language: python
python: "3.6"
group: deprecated-2017Q3
services:
  - postgresql

cache:
  directories:
    - .ci-replay-cache

addons:
  postgresql: "9.4"

env:
  - ""

stages:
  - test
  - deploy

jobs:
  include:
    - stage: deploy
      python: "3.6"
      env: TOX_ENV=py36-django-20
      install: skip
      script: skip
      after_success: skip
      deploy:
        provider: pypi
        user: $PYPI_USER
        password:
          secure: $PYPI_PASSWORD
        on:
          repo: jjkester/django-auditlog
          branch: stable
          condition: $TOX_ENV = py36-django-20

install: pip install -r requirements-test.txt

script: timeout --foreground --signal=INT --kill-after=30s 40m python ci_tox_matrix.py

after_success:
  - codecov -f .coverage
